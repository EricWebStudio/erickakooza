<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eric's profile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #acb6e5);
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .profile-card {
      background: #fff;
      padding: 30px;
      width: 320px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .profile-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.3);
    }
    .profile-img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .profile-card h2 {
      margin: 10px 0;
      color: #333;
    }
    .profile-card p {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }
    .social-links a {
      text-decoration: none;
      color: #fff;
      background: #0073e6;
      padding: 8px 12px;
      margin: 0 5px;
      border-radius: 5px;
      transition: background 0.3s;
    }
    .social-links a:hover {
      background: #005bb5;
    }
  </style>
</head>
<body>

<div class="profile-card">
  <img src="profile_pic.jpg" alt="Eric" class="profile-img">
  <h2>Eric Kakooza</h2>
  <p><strong>A proud Ugandan student| Web Developer & Graphic Designer | Aspiring Entrepreneur | Loves coding and small business ideas</strong></p>

<p>Feel free to reach-out to me via my <strong>social media</strong> handles
</p>

  <div class="social-links">

    <a href="https://www.tiktok.com/@erickakooza" target="_blank">TikTok</a>
    <a href="https://www.youtube.com/@erickakooza" target="_blank">YouTube</a>

<a href="https://wa.link/6avq6i" target="_blank">Whatsapp</a>
  </div>
</div>

</body>
</html>
